name: Build Comatoze v2.81.0
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek sintaks skrip modul
        run: |
          sh -n module/system/bin/ultrapower
          sh -n module/customize.sh
          sh -n module/service.sh
          sh -n module/post-fs-data.sh
          sh -n module/uninstall.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bangun APK manager
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Masukkan APK ke modul
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          mkdir -p module/apk
          cp "$APK" module/apk/comatoze.apk
          unzip -l module/apk/comatoze.apk | grep -E "classes.dex|AndroidManifest"
          test -f module/zygisk/arm64-v8a.so

      - name: Zip modul siap flash
        run: |
          cd module
          zip -r9 ../Comatoze-v2.81.0.zip . -x '*.git*'
          cd ..
          unzip -l Comatoze-v2.81.0.zip | tail -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: Comatoze-v2.81.0
          path: Comatoze-v2.81.0.zip
          if-no-files-found: error
