<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Comatoze</title>
<style>
:root{color-scheme:light;--bg:#F8FAF7;--s1:#E1E5E2;--s2:#EEF1EE;--s3:#CDD5CF;--ln:rgba(25,40,30,.09);--tx:#191C1A;--mu:#5A635D;--ac:#0F6B37;--on:#FFFFFF;--dg:#B3261E;--ok:#0F6B37;--wn:#8A6D00;--sh:0 8px 24px rgba(0,30,10,.12);--ico:#A8F5B6;--icoc:#00531F;
 --t-blue:#0F6B37;--t-purple:#2B6B52;--t-teal:#0B6B5E;--t-amber:#6F6A00;--t-rose:#B3261E}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#101411;--s1:#1E2420;--s2:#29302B;--s3:#343C36;--ln:rgba(200,225,205,.10);--tx:#E1E4DF;--mu:#A3ADA5;--ac:#8BDB9A;--on:#00391B;--dg:#FFB4AB;--ok:#8BDB9A;--wn:#E3C85A;--sh:0 8px 24px rgba(0,0,0,.45);--ico:#2F4A37;--icoc:#A8F5B6;
 --t-blue:#8BDB9A;--t-purple:#9BD6BE;--t-teal:#83D8CB;--t-amber:#D8CC6A;--t-rose:#FFB4AB}}
:root[data-theme=dark]{color-scheme:dark;--bg:#101411;--s1:#1E2420;--s2:#29302B;--s3:#343C36;--ln:rgba(200,225,205,.10);--tx:#E1E4DF;--mu:#A3ADA5;--ac:#8BDB9A;--on:#00391B;--dg:#FFB4AB;--ok:#8BDB9A;--wn:#E3C85A;--sh:0 8px 24px rgba(0,0,0,.45);--ico:#2F4A37;--icoc:#A8F5B6;
 --t-blue:#8BDB9A;--t-purple:#9BD6BE;--t-teal:#83D8CB;--t-amber:#D8CC6A;--t-rose:#FFB4AB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Google Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
 padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(104px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tn-blue{--tone:var(--t-blue)}.tn-purple{--tone:var(--t-purple)}.tn-teal{--tone:var(--t-teal)}.tn-amber{--tone:var(--t-amber)}.tn-rose{--tone:var(--t-rose)}.tn-ac{--tone:var(--ac)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;margin:2px 2px 16px}
.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--ac),var(--t-purple));color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 30%,transparent)}
.logo svg{width:23px;height:23px}
.top .tt{flex:1;min-width:0}
.top h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.3px;line-height:1.15}
.top .sub{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:15px;border:1px solid var(--ln);background:var(--s1);flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:spin .55s cubic-bezier(.3,.9,.3,1)}

/* ---------- surfaces ---------- */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:20px 6px 10px}
.sec:first-child{margin-top:4px}
.mu{color:var(--mu);font-size:13px}
.note{background:var(--s2);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--mu)}
.note b{color:var(--tx)}.note .dg{color:var(--dg)}
.ico{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--tone,var(--ac)) 18%,var(--s2));color:var(--tone,var(--ac));display:flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:21px;height:21px}
.pill{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--tone,var(--ac)) 18%,transparent);color:var(--tone,var(--ac));padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}

/* ---------- hero (beranda) ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 18px;margin-bottom:6px;border:1px solid var(--ln);
 background:radial-gradient(120% 150% at 0% 0%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 62%),radial-gradient(90% 120% at 100% 0%,color-mix(in srgb,var(--t-purple) 22%,transparent),transparent 60%),var(--s1)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;font-weight:700;color:var(--mu);text-transform:uppercase}
.hero-t{font-size:34px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin-top:4px}
.hz{font-weight:700;font-size:14px;padding:7px 13px;border-radius:999px;background:color-mix(in srgb,var(--ac) 22%,transparent);color:var(--ac)}
.hero-d{margin:8px 0 16px;color:var(--mu);font-size:13.5px;min-height:38px}
.hero-t,.hz,.hero-d{transition:opacity .14s,transform .14s}
.out{opacity:0;transform:translateY(5px)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:1px solid var(--ln);background:color-mix(in srgb,var(--s2) 85%,transparent);border-radius:20px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--mu);transition:background .2s,border-color .2s,color .2s,transform .12s}
.mode .ico{background:color-mix(in srgb,var(--tone) 16%,var(--s3));width:44px;height:44px;border-radius:15px}
.mode small{font-weight:600;font-size:11.5px;opacity:.8;margin-top:-4px}
.mode.on{background:color-mix(in srgb,var(--tone) 20%,var(--s2));border-color:var(--tone);color:var(--tx)}
.mode.on .ico{background:var(--tone);color:var(--on)}

/* ---------- stat tiles ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stat .ico{width:36px;height:36px;border-radius:12px}.stat .ico svg{width:18px;height:18px}
.stat b{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.1;display:block}
.stat span{font-size:12px;color:var(--mu)}

/* ---------- toggle rows ---------- */
.tr{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--ln)}
.tr:first-child{border-top:0;padding-top:2px}.tr:last-child{padding-bottom:2px}
.tr .tx{flex:1;min-width:0}
.tr b{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr .d{font-size:12.5px;color:var(--mu);margin-top:2px;line-height:1.4}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dg);background:color-mix(in srgb,var(--dg) 15%,transparent);padding:2px 8px;border-radius:999px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:1}
.sw i{position:absolute;inset:0;background:var(--s3);border:2px solid color-mix(in srgb,var(--mu) 55%,transparent);border-radius:20px;transition:.22s}
.sw i:after{content:"";position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--mu);transition:transform .32s cubic-bezier(.34,1.56,.64,1),width .14s,height .14s,top .14s,left .14s,background .2s}
.sw input:checked+i{background:var(--tone,var(--ac));border-color:var(--tone,var(--ac));box-shadow:0 0 0 5px color-mix(in srgb,var(--tone,var(--ac)) 16%,transparent)}
.sw input:checked+i:after{transform:translateX(20px);width:22px;height:22px;top:1px;left:1px;background:var(--on)}
.sw input:active+i:after{width:26px;height:26px;top:-1px;left:-1px}
.sw input:checked:active+i:after{transform:translateX(16px);width:26px;height:26px;top:-1px;left:-1px}
.tr.danger{--tone:var(--t-rose)}.tr.danger b{color:var(--t-rose)}

/* ---------- buttons / chips ---------- */
.btn{position:relative;overflow:hidden;width:100%;margin-top:14px;border:0;border-radius:18px;padding:0 16px;min-height:50px;font-weight:700;font-size:15px;background:var(--tone,var(--ac));color:var(--on);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s}
.btn svg{width:19px;height:19px}
.btn.tonal{background:color-mix(in srgb,var(--tone,var(--ac)) 18%,var(--s2));color:var(--tone,var(--ac))}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{width:auto;margin:0;min-height:40px;padding:0 16px;border-radius:14px;font-size:13.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);background:var(--s2);color:var(--mu);border-radius:999px;padding:9px 15px;font-weight:600;font-size:13.5px;transition:background .18s,color .18s,border-color .18s,transform .12s}
.chip.on{background:color-mix(in srgb,var(--tone,var(--ac)) 20%,var(--s2));border-color:var(--tone,var(--ac));color:var(--tone,var(--ac))}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 .chip{text-align:center;border-radius:16px;padding:12px 6px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:2px 0 10px}

/* ---------- processor cards (CPU / GPU) ---------- */
.pc{border-radius:26px;overflow:hidden;border:1px solid var(--ln);background:color-mix(in srgb,var(--tone) 4%,var(--s1));margin-bottom:14px}
.pc-h{display:flex;align-items:center;gap:14px;padding:16px 18px;background:color-mix(in srgb,var(--tone) 26%,var(--s1))}
.pc-h .ico{width:52px;height:52px;border-radius:17px;background:color-mix(in srgb,var(--tone) 32%,transparent);color:var(--tone)}
.pc-h .ico svg{width:26px;height:26px}
.pc-t{flex:1;min-width:0}.pc-t b{display:block;font-size:19px;font-weight:700;letter-spacing:-.2px}
.pc-t span{font-size:12.5px;color:color-mix(in srgb,var(--tx) 65%,transparent)}
.pc-v{font-weight:700;font-size:15px;color:var(--tone);text-align:right;line-height:1.15}.pc-v small{display:block;font-size:11px;font-weight:600;color:var(--mu)}
.pc-b{padding:16px 18px 18px}
.sr{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 0;gap:10px}
.sr:first-of-type{margin-top:0}
.sr span{font-size:16px;color:var(--mu)}.sr b{font-size:18px;font-weight:700;color:var(--tone,var(--ac));letter-spacing:-.2px}
.sl{position:relative;margin-top:12px;--p:0%}
.sl input{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;display:block;outline:0}
.sl input::-webkit-slider-runnable-track{height:14px;border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--tone) 40%,var(--s3)),var(--tone) var(--p),var(--s3) var(--p))}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:30px;border-radius:4px;background:var(--tone);margin-top:-8px;box-shadow:0 0 0 4px color-mix(in srgb,var(--tone) 20%,transparent)}
.sl input::-moz-range-track{height:14px;border-radius:9px;background:var(--s3)}
.sl input::-moz-range-progress{height:14px;border-radius:9px;background:var(--tone)}
.sl input::-moz-range-thumb{width:7px;height:30px;border:0;border-radius:4px;background:var(--tone)}
.tk{display:flex;justify-content:space-between;padding:0 3px;margin-top:2px}
.tk i{width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--tone) 60%,var(--s3))}
.rng{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:6px}

/* ---------- battery ---------- */
.bat{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--s3)}.ring .fg{stroke:url(#ringGrad);transition:stroke-dashoffset .6s cubic-bezier(.3,.9,.3,1)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1}.ring .c span{font-size:12px;color:var(--mu);margin-top:4px}
.bat-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.mini{background:var(--s2);border-radius:16px;padding:10px 13px;display:flex;align-items:center;gap:11px}
.mini .mi{width:30px;height:30px;border-radius:10px;background:var(--s3);display:flex;align-items:center;justify-content:center;flex:none;color:var(--tone,var(--ac))}
.mini .mi svg{width:16px;height:16px}
.mini .mt{min-width:0}
.mini b{display:block;font-size:16px;font-weight:700;line-height:1.2}.mini span{font-size:11.5px;color:var(--mu)}
.big-v{font-size:34px;font-weight:700;letter-spacing:-1px;color:var(--tone);line-height:1}

/* ---------- game list ---------- */
.app{display:flex;align-items:center;gap:13px;padding:11px 0;border-top:1px solid var(--ln)}
.app:first-child{border-top:0}
.app .n{flex:1;min-width:0}.app .n b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .n span{font-size:12px;color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai{position:relative;width:48px;height:48px;border-radius:16px;background:var(--s2);border:1px solid var(--ln);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ai b{font-size:19px;font-weight:700;color:var(--ac)}
.ai img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--s2)}
.rm{width:40px;height:40px;border-radius:13px;border:0;background:color-mix(in srgb,var(--dg) 13%,var(--s2));color:var(--dg);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.rm svg{width:19px;height:19px}
.empty{text-align:center;padding:22px 10px;color:var(--mu);font-size:13.5px}
.empty .ico{margin:0 auto 10px;width:56px;height:56px;border-radius:18px}.empty .ico svg{width:28px;height:28px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.head .tx{flex:1}.head b{font-size:17px;font-weight:700;display:block}.head span{font-size:12.5px;color:var(--mu)}

/* ---------- info ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:13.5px}
.kv span{color:var(--mu)}.kv b{font-weight:600;text-align:right;word-break:break-word}
pre#rep{white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;margin:12px 0 0;font-size:11px;background:var(--s2);border-radius:14px;padding:12px;color:var(--mu)}
pre#rep:empty{display:none}
details.card summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary:after{content:"＋";color:var(--mu);font-size:18px}
details.card[open] summary:after{content:"－"}
details.card p{margin:10px 0 0;color:var(--mu);font-size:13.5px;line-height:1.6}

/* ---------- navigation ---------- */
.page{display:none}.page.on{display:block;animation:pageIn .24s ease-out}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:576px;display:flex;gap:0;padding:5px;
 background:color-mix(in srgb,var(--s1) 95%,transparent);border:1px solid var(--ln);border-radius:20px;box-shadow:var(--sh);z-index:10}
.nav-ind{position:absolute;top:5px;left:0;bottom:5px;width:56px;border-radius:15px;background:color-mix(in srgb,var(--ac) 20%,transparent);border:1px solid color-mix(in srgb,var(--ac) 50%,transparent);transition:transform .35s cubic-bezier(.65,0,.35,1),width .35s cubic-bezier(.65,0,.35,1);z-index:0;pointer-events:none}
nav button{position:relative;z-index:1;flex:1;border:0;background:transparent;color:var(--mu);font-weight:600;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;min-width:0}
nav .pl{display:flex;align-items:center;justify-content:center;width:22px;height:22px;transition:color .25s}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}
nav button.on .pl{color:var(--ac)}
nav button.pop svg{animation:pop .32s ease-out}

/* ---------- bottom sheet ---------- */
.ov{position:fixed;inset:0;background:rgba(2,6,12,.58);opacity:0;pointer-events:none;transition:opacity .28s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;height:min(86vh,720px);display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--ln);border-bottom:0;border-radius:30px 30px 0 0;
 transform:translateY(105%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.9,.25,1),visibility 0s .34s;z-index:21;padding:0 18px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.35)}
.sheet.on{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.9,.25,1),visibility 0s}.sheet.drag{transition:none}
.grab{padding:12px 0 10px;touch-action:none;flex:none}.grab i{display:block;width:44px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto}
.sheet .head{margin:6px 0 14px}
.sheet .head .ico{width:50px;height:50px;border-radius:50%;background:transparent;border:1.5px solid color-mix(in srgb,var(--ac) 40%,transparent)}
.srch{position:relative;flex:none}
.srch svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mu)}
.srch input{width:100%;height:50px;border-radius:18px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:inherit;font-size:15px;padding:0 16px 0 46px;outline:0}
.srch input:focus{border-color:var(--ac)}
.plist{flex:1;overflow-y:auto;margin:10px -6px 0;padding:0 6px;overscroll-behavior:contain}
.pi{display:flex;align-items:center;gap:13px;padding:10px 10px;border-radius:18px;border:0;background:transparent;width:100%;text-align:left;border-bottom:1px solid var(--ln);border-radius:0;transition:background .15s}
.pi.on{background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:18px;border-bottom-color:transparent}
.pi .n{flex:1;min-width:0}.pi .n b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .n span{font-size:12.5px;color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--mu) 60%,transparent);display:flex;align-items:center;justify-content:center;flex:none;transition:.18s;color:transparent}
.ck svg{width:16px;height:16px;stroke-width:3}
.pi.on .ck{background:var(--ac);border-color:var(--ac);color:var(--on)}
.sf{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:14px;flex:none}
.sf span{color:var(--mu);font-size:14px}
.sf .btn{margin:0;width:auto;min-width:150px}

/* ---------- misc ---------- */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:30;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:.97;transform:translateX(-50%)}
button:active{transform:scale(.97)}
.mode:active,.chip:active{transform:scale(.95)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);position:relative;margin-right:7px;vertical-align:1px}
.live-dot:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:livePulse 1.8s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}

function exec(cmd){return new Promise(res=>{
  if(typeof ksu==='undefined'){res({code:-1,out:''});return;}
  const cb='cb_'+Date.now()+Math.floor(Math.random()*1e6);
  window[cb]=(c,o)=>{delete window[cb];res({code:c,out:o||''});};
  ksu.exec(cmd,'{}',cb);});}

/* ---------- efek loading (hanya tampilan): spinner mini di kontrol yang barusan diketuk + bar tipis di atas + tanda ✓/✕ saat selesai.
   Penanda disimpan per kontrol (kunci dari atribut onclick/onchange) supaya tetap tampil walau halaman digambar ulang oleh status terbaru. ---------- */
let _lastCtl=null,_lastT=0,_mark=null,_pend=0,_inf=0;
document.addEventListener('pointerdown',e=>{const c=e.target&&e.target.closest&&e.target.closest('.sw,.btn,.mt,.chip');if(c){_lastCtl=c;_lastT=Date.now();}},true);
const ctlKey=el=>{const i=el.querySelector&&el.querySelector('input');return (el.getAttribute('onclick')||'')+'|'+(i?(i.getAttribute('onchange')||''):'');};
function topBar(d){_inf=Math.max(0,_inf+d);const b=$('#topbar');if(b)b.classList.toggle('on',_inf>0);}
function _sliderInit(){document.querySelectorAll('input[type=range].sl').forEach(e=>{const mn=+e.min||0,mx=+e.max||100;e.style.setProperty('--p',(mx>mn?(e.value-mn)/(mx-mn)*100:0)+'%');});}
document.addEventListener('input',e=>{const x=e.target;if(x&&x.type==='range'&&x.classList&&x.classList.contains('sl')&&!(x.parentNode&&x.parentNode.classList&&x.parentNode.classList.contains('sl'))){const mn=+x.min||0,mx=+x.max||100;x.style.setProperty('--p',(mx>mn?(x.value-mn)/(mx-mn)*100:0)+'%');}},true);
function _applyMark(){
  if(!_mark)return;
  document.querySelectorAll('.sw,.btn,.mt,.chip').forEach(e=>{if(ctlKey(e)===_mark.key){e.classList.remove('busy','ok','bad');e.classList.add(_mark.cls);}});
}
function busyWrap(p){ // mengembalikan p yang SAMA; hanya mengatur kelas tampilan (redup + bar atas selama berjalan)
  const el=_lastCtl;if(!el||Date.now()-_lastT>1500)return p;
  const key=ctlKey(el);if(key==='|')return p;
  if(!_mark||_mark.key!==key){_pend=0;_mark={key,cls:'busy'};}
  _pend++;topBar(1);_applyMark();const t0=Date.now();
  const fin=()=>setTimeout(()=>{
    topBar(-1);if(--_pend>0)return;
    _mark=null;document.querySelectorAll('.busy').forEach(e=>e.classList.remove('busy'));
  },Math.max(0,250-(Date.now()-t0)));
  p.then(fin,fin);return p;
}

let tTo;function toast(t){const e=$('#toast');e.textContent=t;e.className='show';clearTimeout(tTo);tTo=setTimeout(()=>e.className='',Math.max(1800,String(t).length*60));}
const list=s=>(s||'').trim().split(/\s+/).filter(Boolean);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parse(t){
  const s={cpu:[],gpu:null,gpup:null,refresh:0,mode:'balance',feat:{},gfxApp:{},dns:{key:'default',h:'',mode:'',spec:''}};
  t.split('\n').forEach(l=>{const a=l.split('|');
    if(a[0]==='MODE')s.mode=a[1];
    else if(a[0]==='DEV')s.dev={brand:a[1],model:a[2],soc:a[3],kernel:a[4],android:a[5],gpu:a[6]};
    else if(a[0]==='THERMRUN')s.thermrun=parseInt(a[1]);
    else if(a[0]==='BAT')s.bat={lvl:a[1],st:a[2],cur:+a[3],temp:+a[4]},s.chgn=parseInt(a[6])||0,s.cut=parseInt(a[7])||80;
    else if(a[0]==='CHGM')s.chgm={m:a[1],held:a[2]==='1',fail:a[3],q:a[4]||''};
    else if(a[0]==='PROF')s.prof=a[1]==='on';
    else if(a[0]==='GWD')s.gwd={alive:a[1]==='1',ing:a[2]==='1',n:+a[3]||0,last:a[4]||''};
    else if(a[0]==='RATES')s.rates=list(a[1]).map(Number);
    else if(a[0]==='GPROF'){s.gprof={};(a[1]||'').split(',').filter(Boolean).forEach(e=>{const f=e.split('~');if(f[0])s.gprof[f[0]]={mode:f[1]||'',hz:f[2]||''};});}
    else if(a[0]==='GPCFG')s.gpcfg={mode:a[1]||'perf',hz:parseInt(a[2])||120};
    else if(a[0]==='COLOR')s.color={sat:+a[1]||100,r:+a[2]||100,g:+a[3]||100,b:+a[4]||100};
    else if(a[0]==='ANGLE')s.ang={style:a[1]||'blok',ok:a[2]==='yes',apps:(a[3]||'').split(';').filter(Boolean)};
    else if(a[0]==='GFX')s.gfx={scale:+a[1]||100,drv:a[2]||'default',angle:a[3]||'default'};
    else if(a[0]==='GFXA'){s.gfxApp={};(a[1]||'').split(',').filter(Boolean).forEach(pair=>{const[pk,vv]=pair.split(':');if(pk)s.gfxApp[pk]=+vv;});}
    else if(a[0]==='GAMES')s.games=list(a[1]);
    else if(a[0]==='FEAT')s.feat[a[1]]=a[2]==='on';
    else if(a[0]==='FPSGOSUP')s.fpsgoSup=a[1]==='yes';
    else if(a[0]==='GPUP')s.gpup=list(a[1]).map(Number).sort((x,y)=>x-y);
    else if(a[0]==='DPI')s.dpi={phys:+a[1]||0,ov:a[2]?+a[2]:null};
    else if(a[0]==='DNS')s.dns={key:a[1]||'default',h:a[2]||'',mode:a[3]||'',spec:a[4]||''};
    else if(a[0]==='CHIPZ')s.chipZ=a[1]==='yes';
    else if(a[0]==='SPOOFZ')s.spoofZ=a[1]==='yes';
    else if(a[0]==='SPOOFAPPS')s.spoofApps=(a[1]||'').split(';').filter(Boolean).map(e=>{const f=e.split('~');return{pkg:f[0],key:f[1],man:f[2],mod:f[3],on:f[4]!=='0',full:f[5]==='1',hw:f[6]||'',board:f[7]||'',sm:f[8]||'',smd:f[9]||''};});
    else if(a[0]==='COOL')s.cool=+a[1]||0;
    else if(a[0]==='IOS')s.ios={cur:a[1]||'',list:(a[2]||'').split(',').filter(Boolean)};
    else if(a[0]==='OVL')s.ovl={on:a[1]==='on',app:a[2]==='1',net:a[3]!=='off',auto:a[4]!=='off',res:a[5]||'720',br:a[6]||'auto',fps:a[7]||'60'};
    else if(a[0]==='REND')s.rend=a[1]||'default';
    else if(a[0]==='GED')s.ged=a[1]==='yes'?{ok:true,lv:a[2]||'',cur:+a[3]||0}:{ok:false};
    else if(a[0]==='DRAM')s.dram=a[1]==='yes'?{ok:true,freqs:(a[2]||'').split(' ').filter(Boolean).map(Number),cur:+a[3]||0,min:+a[4]||0,max:+a[5]||0,lock:+a[6]||0,ram:+a[7]||0}:{ok:false};
    else if(a[0]==='ZRAM')s.zram=a[1]==='yes'?{ok:true,ram:+a[2]||0,disk:+a[3]||0,algo:a[4]||'',algos:(a[5]||'').split(' ').filter(Boolean),swp:a[6]||'',preset:a[7]||'',used:+a[8]||0,state:a[9]||'',msg:a[10]||''}:{ok:false};
    else if(a[0]==='DEXOPT')s.dex={state:a[1]||'idle',mode:a[2]||'',done:+a[3]||0,total:+a[4]||0,pkg:a[5]||''};
    else if(a[0]==='CPU'||a[0]==='GPU'){
      const o={name:a[1],gov:a[2],min:a[3],max:a[4],cur:a[5],govs:list(a[6]),freqs:list(a[7]).map(Number).sort((x,y)=>x-y),cpus:a[8]||''};
      a[0]==='CPU'?s.cpu.push(o):(s.gpu=o);}
  });return s;}

const ico=(n,tn)=>`<span class="ico ${tn?'tn-'+tn:''}">${IC[n]||''}</span>`;
const SL={};   /* registry slider: id -> {vals,fmt,cb} */
function slider(id,vals,idx,fmt,cb){
  SL[id]={vals,fmt,cb};const n=vals.length,mx=Math.max(n-1,0),i=Math.min(Math.max(idx,0),mx),p=mx?i/mx*100:100;
  const dots=Math.min(n,9);
  return `<div class="sl" style="--p:${p}%"><input type="range" id="${id}" min="0" max="${mx}" step="1" value="${i}" oninput="slIn(this)" onchange="slCh(this)">
   <div class="tk">${Array(dots).fill('<i></i>').join('')}</div></div>`;}
function slIn(el){const r=SL[el.id];if(!r)return;const mx=+el.max||1;el.parentNode.style.setProperty('--p',(el.value/mx*100)+'%');
  const v=$('#'+el.id+'_v');if(v)v.textContent=r.fmt(r.vals[el.value]);
  /* min tidak boleh melewati max (dan sebaliknya) */
  if(/_mn$/.test(el.id)){const o=$('#'+el.id.replace(/_mn$/,'_mx'));if(o&&+o.value<+el.value){o.value=el.value;slIn(o);}}
  if(/_mx$/.test(el.id)){const o=$('#'+el.id.replace(/_mx$/,'_mn'));if(o&&+o.value>+el.value){o.value=el.value;slIn(o);}}}
function slCh(el){const r=SL[el.id];if(r&&r.cb)r.cb(r.vals[el.value]);}
const mhzF=d=>v=>v?Math.round(v/d)+' MHz':'Auto';
function srow(label,id,vals,idx,fmt,cb,tn){
  return `<div class="sr"><span>${label}</span><b id="${id}_v">${fmt(vals[Math.min(Math.max(idx,0),vals.length-1)])}</b></div>${slider(id,vals,idx,fmt,cb)}
   <div class="rng"><span>${fmt(vals[0])}</span><span>${fmt(vals[vals.length-1])}</span></div>`;}
const nearest=(arr,v)=>{v=+v;let b=0;arr.forEach((x,i)=>{if(Math.abs(x-v)<Math.abs(arr[b]-v))b=i;});return b;};

const row=(f,compact)=>{const tn=f.danger?'rose':(f.tn||'blue');const ok=f.ok?f.ok(S):true;
 const full=(ok?f.desc:(f.nope||f.desc))+(f.id==='nothermal'&&S.thermrun!=null?' · Service thermal berjalan: '+S.thermrun:'');
 return `<div class="tr tn-${tn} ${f.danger?'danger':''}">${ico(f.ic||'bolt',tn)}
  <div class="tx" ${compact?'':'onclick="this.parentNode.classList.toggle(\'open\')"'}><b>${f.name}${f.danger?'<span class="tag">Berisiko</span>':''}</b>${compact?'':`${f.danger?`<div class="d">${f.short||full}</div>`:''}<div class="fd">${full}</div>`}</div>
  <label class="sw"><input type="checkbox" ${S.feat[f.id]?'checked':''} ${ok?'':'disabled'} onchange="setFeat('${f.id}',this.checked)"><i></i></label></div>`;};
const rows=g=>FEATURES.filter(f=>(f.group||'sys')===g&&!f.hide).map(row).join('');
const rowsById=(ids,compact)=>ids.map(id=>FEATURES.find(f=>f.id===id)).filter(Boolean).map(f=>row(f,compact)).join('');

/* ---------- BERANDA ---------- */
const MODE_SHORT={perf:'Clock maksimal untuk game',balance:'Seimbang untuk harian',eco:'Hemat daya dan lebih dingin'};
function activeChips(s){const f=s.feat||{},c=[],add=(t,tn)=>c.push(`<span class="ch2 tn-${tn}"><i></i>${t}</span>`);
  if(f.perfx)add('Tweak Ekstra Performa','rose');
  if(f.ecox)add('Tweak Ekstra Eco','teal');
  if(f.nothermal)add('Thermal dimatikan','rose');
  if(f.touchboost)add('Boost Touch','blue');
  if(f.bkt)add('Kernel Tweaks','blue');
  if(f.smooth)add('Anti Kill Proses Latar','teal');
  const sp=(s.spoofApps||[]).filter(x=>x.on).length;if(sp)add('Spoof '+sp+' aplikasi','blue');
  const an=((s.ang||{}).apps||[]).length;if(an)add('ANGLE '+an+' game','purple');
  if(f.wifilatency)add('WiFi Low Latency','blue');
  if(f.dnd)add("Don't Disturb",'purple');
  if(f.doze)add('Doze','blue');
  if(f.datasaver)add('Data Saver','teal');
  if(s.prof)add('Profil Game aktif','amber');
  return c.length?`<div class="chips2">${c.join('')}</div>`:`<p class="mu" style="margin:0 6px 12px">Belum ada fitur tambahan yang aktif.</p>`;}
function pageHome(s){
  const cur=MODES.find(x=>x[0]===s.mode),tn=cur?cur[3]:'blue';
  return `<div class="hero2 tn-${tn}" id="hero2"><div class="ring"><div class="core">${IC[cur?cur[1]:'cpu']||''}</div></div>
    <div class="ht"><b id="h2n">${cur?cur[2]:'Manual'}</b><span id="h2d">${cur?MODE_SHORT[s.mode]+' · '+hzFor(s,s.mode):'Pengaturan CPU/GPU kustom dari Tweaks › CPU & GPU'}</span></div></div>
  <div class="mtiles">${MODES.map(([k,i,n,t])=>`<button class="mt tn-${t} ${s.mode===k?'on':''}" data-m="${k}" onclick="setMode('${k}')">${IC[i]||''}<span>${n}</span></button>`).join('')}</div>
  <div class="sec">Sedang aktif</div>
  ${activeChips(s)}
  ${s.mode==='perf'?`<div class="note tn-rose" style="margin:0 0 12px"><b class="dg">Clock dipaksa mentok.</b> ${PERF_NOTE}</div>`:''}
  `;
}
const ST={Charging:'Sedang mengisi',Discharging:'Tidak mengisi','Not charging':'Tidak mengisi',Full:'Penuh'};
const STS={Charging:'Mengisi',Discharging:'Tidak mengisi','Not charging':'Tidak mengisi',Full:'Penuh'};

/* ---------- PERFORMA ---------- */
function procCard(kind,o,div,title,sub,icon,tn){
  const key=kind+'_'+(kind==='gpu'?'x':o.name),f=mhzF(div);
  const fr=o.freqs.length?o.freqs:[+o.min||0,+o.max||0];
  const govs=o.govs.length?`<div class="lbl">Governor</div><div class="chips" data-gov="${esc(o.gov||'')}">${o.govs.map(g=>`<button class="chip ${g===o.gov?'on':''}" onclick="pickGov(this,'${esc(g)}')">${esc(g)}</button>`).join('')}</div>`:'';
  return `<div class="pc tn-${tn}" id="pc_${key}" data-kind="${kind}" data-name="${esc(o.name)}" data-gov="${esc(o.gov||'')}">
   <div class="pc-h">${ico(icon,tn)}<div class="pc-t"><b>${title}</b><span>${sub}</span></div><div class="pc-v">${f(+o.cur)}<small>sekarang</small></div></div>
   <div class="pc-b">${govs}
    <div style="height:${govs?18:0}px"></div>
    ${srow('Minimum Frequency',key+'_mn',fr,nearest(fr,o.min),f)}
    ${srow('Maximum Frequency',key+'_mx',fr,nearest(fr,o.max),f)}
    <button class="btn tonal" onclick="applyOne('${kind}','${esc(o.name)}')">${IC.check} Terapkan</button></div></div>`;
}
function pageCpu(s){
  const cl=[...s.cpu].sort((a,b)=>(a.freqs[a.freqs.length-1]||0)-(b.freqs[b.freqs.length-1]||0));
  const n=cl.length,names=n===1?['CPU']:n===2?['Little Cluster','Big Cluster']:n===3?['Little Cluster','Big Cluster','Prime Cluster']:cl.map((c,i)=>'Cluster '+(i+1));
  const tones=n===1?['purple']:n===2?['blue','purple']:['blue','purple','rose'];
  let h='<div class="sec">CPU</div>'+cl.map((c,i)=>procCard('cpu',c,1000,names[i],c.name+' · cpu '+c.cpus,'cpu',tones[i]||'purple')).join('');
  h+='<div class="sec">GPU</div>';
  if(s.gpup){
    const vals=[0,...s.gpup],f=v=>v?Math.round(v/1000)+' MHz':'Auto';
    h+=`<div class="pc tn-teal"><div class="pc-h">${ico('gpu','teal')}<div class="pc-t"><b>GPU</b><span>gpufreq · kunci frekuensi</span></div><div class="pc-v">Kunci<small>manual</small></div></div>
     <div class="pc-b">${srow('Frekuensi GPU','gpup_f',vals,0,f)}
     <button class="btn tonal" onclick="applyGpuP()">${IC.check} Terapkan</button></div></div>`;
  }else if(s.gpu){h+=procCard('gpu',s.gpu,1e6,'GPU',(s.dev&&s.dev.gpu&&s.dev.gpu!=='devfreq'?s.dev.gpu+' · ':'')+'devfreq','gpu','teal');}
  else h+='<div class="card"><div class="empty">GPU tidak terdeteksi.</div></div>';
  return h;
}
function pickGov(el,g){const w=el.parentNode;w.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));el.closest('.pc').dataset.gov=g;}

/* ---------- DAYA ---------- */
function pageChg(s){const b=s.bat||{},cut=s.cut||80,lvl=Math.max(0,Math.min(100,+b.lvl||0)),C=2*Math.PI*54;
  const charging=b.st==='Charging',tn=lvl<=20&&!charging?'rose':charging?'teal':'blue';
  const cuts=Array.from({length:50},(_,i)=>i+50);
  return `<div class="card"><div class="bat tn-${tn}">
   <div class="ring"><svg viewBox="0 0 132 132">
     <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--tone)"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--tone) 55%,white)"/></linearGradient></defs>
     <circle class="bg" cx="66" cy="66" r="54"/><circle class="fg" cx="66" cy="66" r="54" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-lvl/100)}"/></svg>
    <div class="c"><b>${b.lvl||'-'}%</b><span>${STS[b.st]||b.st||'-'}</span></div></div>
   <div class="bat-r"><div class="mini"><div class="mi">${IC.bolt}</div><div class="mt"><b>${b.cur?Math.round(Math.abs(b.cur)/1000)+' mA':'-'}</b><span>Arus</span></div></div>
    <div class="mini"><div class="mi">${IC.temp}</div><div class="mt"><b>${b.temp?(b.temp/10).toFixed(1)+'°C':'-'}</b><span>Suhu baterai</span></div></div></div></div></div>
  <div class="sec">Pengisian</div>
  <div class="card">${rows('chg')}</div>
  <div class="card tn-amber"><div class="head">${ico('battery','amber')}<div class="tx"><b>Batas Auto Cut</b><span>Berhenti di batas ini</span></div><div class="big-v" id="cutv_v">${cut}%</div></div>
   ${slider('cutv',cuts,cut-50,v=>v+'%',setCut)}<div class="rng"><span>50%</span><span>99%</span></div></div>
  <div class="sec">Metode Charging</div>
  <div class="card"><div class="note">${chgInfo(s)}</div>
   <button class="btn ghost" onclick="chgReset()">${IC.refresh} Deteksi Ulang Metode</button>
   </div>`;}
function chgInfo(s){const c=s.chgm||{};const st=(s.bat||{}).st||'';
 if(c.m){const pq=(c.q||'').split(':');
  const part=pq[0]==='partial';
  return 'Metode aktif: <b>'+c.m.replace(/,$/,'').replace(/,/g,', ')+'</b><br>Pengisian: <b>'+(c.held?'DITAHAN (cut/bypass)':'normal')+'</b>'+
   (part?'<br><b class="dg">Hanya sebagian: arus turun '+pq[1]+' → '+pq[2]+' mA, belum berhenti total.</b> Buat Laporan Perangkat dan kirim ke pengembang.':'');}
 if(c.fail)return '<b class="dg">Semua metode gagal menghentikan pengisian.</b> Buat Laporan Perangkat dan kirim ke pengembang.';
 return 'Belum ada metode terpilih. Colokkan charger (status harus "Charging") dengan Auto Cut/Bypass aktif agar deteksi berjalan (bisa 1-3 menit). Status sekarang: <b>'+(st||'-')+'</b>';}
async function chgReset(){toast('Mereset…');await run('chgreset');await load();toast('Deteksi diulang');}
async function setCut(v){await run('cut '+v);toast('Batas '+v+'%');}

/* ---------- GAME ---------- */
function labelOf(p){return LBL[p]||p.split('.').pop();}
function prefetchLabels(pkgs){const need=pkgs.filter(p=>!(p in LBL));if(!need.length)return;
  try{if(typeof ksu!=='undefined'&&typeof ksu.getPackagesInfo==='function'){
    const j=JSON.parse(ksu.getPackagesInfo(JSON.stringify(need)));(j||[]).forEach(o=>{if(o&&o.packageName&&o.appLabel)LBL[o.packageName]=o.appLabel;});}}catch(e){}}
function appIcon(p){return `<div class="ai"><b>${esc((labelOf(p)[0]||'?').toUpperCase())}</b><img src="ksu://icon/${esc(p)}" loading="lazy" alt="" onerror="this.style.display='none'"></div>`;}
let GDIAG='';
async function gdiagRun(){toast('Memeriksa pemantau game…');const r=await run('gdiag');GDIAG=((r&&r.out)||'').trim();render();}
function gwdLine(s){const w=s.gwd;if(!w)return '';
 const st=!w.alive?'Pemantau game MATI (nyalakan salah satu saklar game di bawah)':(w.n?`Pemantau aktif · ${w.ing?'sedang di dalam game':'menunggu game dibuka'} · ${w.n} game di daftar`:'Pemantau aktif, tetapi daftar game kosong: tambahkan game di bawah');
 return `<p class="mu" style="margin:10px 2px 0">${st}${w.last?'<br>Terakhir: '+esc(w.last):''}</p><button class="btn tonal" style="margin-top:8px" onclick="gdiagRun()">Cek pemantau game</button>${GDIAG?`<pre class="mu" style="white-space:pre-wrap;margin:10px 2px 0;font-size:12px">${esc(GDIAG)}</pre>`:''}`;}
function gpCard(s){const g=s.gpcfg||{mode:'perf',hz:120};
 return `<div class="card"><div class="head">${ico('rocket','purple')}<div class="tx"><b>Profil Game</b><span>Mode dan Hz saat game</span></div></div>
  <div class="lbl" style="margin-top:14px">Mode</div>
  <div class="seg3 tn-purple" data-grp="mode">${MODES.map(([k,i,n])=>`<button class="chip ${g.mode===k?'on':''}" onclick="gpPick('mode','${k}',this)">${n}</button>`).join('')}</div>
  <div class="lbl" style="margin-top:16px">Refresh Rate</div>
  <div class="seg3 tn-blue" data-grp="hz">${RT(s).map(v=>`<button class="chip ${g.hz==v?'on':''}" onclick="gpPick('hz','${v}',this)">${v} Hz</button>`).join('')}</div>
  ${gwdLine(s)}</div>`;}
/* ---------- Profil per game: mode & Hz sendiri tiap game ('' = ikut Profil Game global) ---------- */
let PG_OPEN=null;
function pgToggle(p){PG_OPEN=PG_OPEN===p?null:p;render();}
const PG_MODES=[['','Ikut global'],['perf','Performa'],['balance','Seimbang'],['eco','Eco'],['skip','Jangan ubah']];
function pgSummary(c){if(c.mode==='skip')return 'Jangan ubah apa pun';const m=c.mode?(MODE_NAME[c.mode]||c.mode):'Mode global',h=c.hz?c.hz+' Hz':'Hz global';return m+' · '+h;}
function pgCard(s){const g=s.games||[],ov=s.gprof||{};
 if(!g.length)return '';
 return `<div class="card tn-purple"><div class="head">${ico('rocket','purple')}<div class="tx"><b>Profil Per Game</b><span>Mode dan Hz per game</span></div></div>
  ${g.map(p=>{const c=ov[p]||{mode:'',hz:''},open=PG_OPEN===p;
   return `<div class="app" style="cursor:pointer" onclick="pgToggle('${esc(p)}')">${appIcon(p)}<div class="n"><b>${esc(labelOf(p))}</b><span>${pgSummary(c)}</span></div>
     <span class="ico" style="width:30px;height:30px;transform:rotate(${open?'180':'0'}deg);transition:transform .22s">${IC.chev}</span></div>
    ${open?`<div style="padding:2px 0 15px" onclick="event.stopPropagation()">
     <div class="lbl">Mode</div><div class="chips">${PG_MODES.map(([k,n])=>`<button class="chip ${c.mode===k?'on':''}" onclick="pgSet('${esc(p)}','mode','${k}')">${n}</button>`).join('')}</div>
     ${c.mode==='skip'?'':`<div class="lbl" style="margin-top:12px">Refresh Rate</div><div class="chips"><button class="chip ${c.hz===''?'on':''}" onclick="pgSet('${esc(p)}','hz','')">Ikut global</button>${RT(s).map(v=>`<button class="chip ${String(c.hz)===String(v)?'on':''}" onclick="pgSet('${esc(p)}','hz','${v}')">${v} Hz</button>`).join('')}</div>`}</div>`:''}`;}).join('')}
  </div>`;}
async function pgSet(p,k,v){S.gprof=S.gprof||{};const c=S.gprof[p]=S.gprof[p]||{mode:'',hz:''};c[k]=v;render();
  await queueAct(()=>run(`gp_game ${p} ${c.mode||'-'} ${c.hz||'-'}`));toast('Disimpan');}
const SCALE_OPTS=[100,90,80,70,60,50,40,30,20,10,1];
const scaleFmt=v=>v===100?'Normal':v+'%';
/* ---------- Gaya Tekstur ANGLE (per-app) ---------- */
const ANG_STYLES=[['blok','Blok','Kotak-kotak ala Minecraft'],['halus','Halus','Tekstur blur & halus'],['plain','ANGLE saja','Hanya ANGLE, tanpa efek tekstur']];
function angleStyleCard(s){const g=s.ang||{style:'blok',ok:true,apps:[]},a=g.apps||[];prefetchLabels(a);
 const cur=ANG_STYLES.find(x=>x[0]===g.style)||ANG_STYLES[0];
 return `<div class="card"><div class="head">${ico('layers','purple')}<div class="tx"><b>Gaya Tekstur (ANGLE)</b><span>${a.length?a.length+' game memakai ANGLE':'Belum ada game dipilih'}</span></div>
   <button class="btn sm" onclick="angOpen()">${IC.plus} Tambah</button></div>
  <div class="lbl" style="margin-top:14px">Gaya</div>
  <div class="seg3 tn-purple" data-grp="angst">${ANG_STYLES.map(([k,n])=>`<button class="chip ${g.style===k?'on':''}" onclick="angStyle('${k}',this)">${n}</button>`).join('')}</div>
  <p class="mu" style="margin:6px 2px 0">${esc(cur[2])}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px"><button class="chip" onclick="angAll()">+ Semua game di daftar</button>${a.length?`<button class="chip" onclick="angClear()">Matikan semua</button>`:''}</div>
  ${a.map(p=>`<div class="app">${appIcon(p)}<div class="n"><b>${esc(labelOf(p))}</b><span>${esc(p)}</span></div><button class="rm" onclick="angDel('${esc(p)}')" aria-label="Hapus">${IC.trash}</button></div>`).join('')}
  ${g.ok?'':'<p class="mu" style="margin:12px 2px 0">ANGLE tidak terdeteksi di perangkat ini.</p>'}</div>`;}
async function angStyle(k,el){el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));toast('Menerapkan…');
  const r=await run('angle_style '+k);await load();toast((r.out||'').trim().startsWith('OK')?'Gaya diterapkan · buka ulang gamenya':'Gagal: '+((r.out||'').split('|')[1]||'tidak ada respon'));}
async function angAll(){toast('Menerapkan…');const r=await run('angle_app all');await load();toast((r.out||'').trim().startsWith('OK')?'Semua game di daftar memakai ANGLE · buka ulang gamenya':'Gagal');}
async function angClear(){toast('Menonaktifkan…');const r=await run('angle_app clear');await load();toast((r.out||'').trim().startsWith('OK')?'Dimatikan · buka ulang gamenya':'Gagal');}
async function angDel(p){if(!/^[A-Za-z0-9._]+$/.test(p))return;await run('angle_app del '+p);await load();toast('Dihapus · buka ulang gamenya');}
let AQ={sel:new Set(),q:''};
async function angOpen(){
  AQ={sel:new Set(),q:''};
  $('#sheet').innerHTML=`<div class="grab" id="grab"><i></i></div>
   <div class="head">${ico('layers','purple')}<div class="tx"><b>Pilih game untuk ANGLE</b><span>Pilih game</span></div></div>
   <div class="srch">${IC.search}<input id="aq" type="search" placeholder="Cari nama aplikasi atau package…" autocomplete="off" oninput="AQ.q=this.value;angRender()"></div>
   <div class="plist" id="alist"><div class="empty">Memuat daftar aplikasi…</div></div>
   <div class="sf"><span id="acount">0 aplikasi dipilih</span><button class="btn" id="aadd" disabled onclick="angAdd()">Terapkan</button></div>`;
  $('#ov').classList.add('on');$('#sheet').classList.add('on');$('#sheet').setAttribute('aria-hidden','false');bindGrab();
  if(!INST){const r=await run('games list');INST=list(r.out);prefetchLabels(INST);}
  angRender();
}
function angRender(){
  const el=$('#alist');if(!el)return;const q=AQ.q.trim().toLowerCase(),have=(S.ang&&S.ang.apps)||[];
  const arr=(INST||[]).filter(p=>!have.includes(p)&&(!q||p.toLowerCase().includes(q)||labelOf(p).toLowerCase().includes(q))).sort((a,b)=>labelOf(a).localeCompare(labelOf(b)));
  el.innerHTML=arr.length?arr.map(p=>`<button class="pi ${AQ.sel.has(p)?'on':''}" onclick="angToggle('${esc(p)}')">${appIcon(p)}<div class="n"><b>${esc(labelOf(p))}</b><span>${esc(p)}</span></div><span class="ck">${IC.check}</span></button>`).join(''):
   `<div class="empty">${(INST||[]).length?'Tidak ada aplikasi yang cocok.':'Tidak ada aplikasi pihak ketiga ditemukan.'}</div>`;
  angCount();}
function angToggle(p){AQ.sel.has(p)?AQ.sel.delete(p):AQ.sel.add(p);
  document.querySelectorAll('#alist .pi').forEach(b=>{b.classList.toggle('on',AQ.sel.has(b.querySelector('.n span').textContent));});angCount();}
function angCount(){const n=AQ.sel.size;$('#acount').textContent=n+' aplikasi dipilih';$('#aadd').disabled=!n;}
async function angAdd(){
  const arr=[...AQ.sel];if(!arr.length)return;$('#aadd').disabled=true;let bad='';
  for(const p of arr){if(!/^[A-Za-z0-9._]+$/.test(p))continue;const r=await run('angle_app add '+p);if(!(r.out||'').trim().startsWith('OK'))bad=(r.out||'').split('|')[1]||'gagal';}
  closePick();await load();toast(bad?'Gagal: '+bad:arr.length+' game memakai ANGLE · buka ulang gamenya');}
function gfxCard(s){const g=s.gfx||{scale:100,drv:'default',angle:'default'};
 return `<div class="card"><div class="head">${ico('layers','teal')}<div class="tx"><b>Driver & API Grafis</b><span>Hanya game di daftar</span></div></div>
  <div class="lbl" style="margin-top:14px">Driver grafis (Vulkan)</div>
  <div class="seg3 tn-blue" data-grp="drv">${[['default','Default'],['driver','Game Driver'],['native','Driver Sistem']].map(([k,n])=>`<button class="chip ${g.drv===k?'on':''}" onclick="gfxPick('drv','${k}',this)">${n}</button>`).join('')}</div>

}

async function chipRun(pkg,args,okMsg){
  const r=await run(`spoofapp chip ${pkg} ${args}`),o=(r.out||'').trim();
  if(o.startsWith('OK')){closePick();await load();toast(okMsg+' · buka ulang aplikasinya');}
  else{toast(o.startsWith('ERR|')?'Gagal: '+o.split('|')[1]:CHIP_FAIL);}}
async function chipSet(pkg,key){if(!/^[A-Za-z0-9._]+$/.test(pkg))return;const c=CHIPS.find(x=>x[0]===key);
  await chipRun(pkg,chipArgs(c),c?'Chip '+c[1]+' diatur':'Memakai chip asli');}
async function chipCustom(pkg){if(!/^[A-Za-z0-9._]+$/.test(pkg))return;
  const v=id=>($(id).value||'').trim(),ok=/^[A-Za-z0-9 ._+-]{1,40}$/,f=['#ckHw','#ckBd','#ckSm','#ckSd'].map(v);
  if(f.every(x=>!x)){toast('Isi minimal hardware atau model SoC');return;}
  if(f.some(x=>x&&!ok.test(x))){toast('Hanya huruf, angka, spasi dan . _ + -');return;}
  await chipRun(pkg,f.map(x=>x?`'${x}'`:"'-'").join(' '),'Chip kustom diatur');}

function spoofAppRender(){

  const arr=(INST||[]).filter(p=>!q||p.toLowerCase().includes(q)||labelOf(p).toLowerCase().includes(q)).sort((a,b)=>labelOf(a).localeCompare(labelOf(b)));
  el.innerHTML=arr.length?arr.map(p=>`<button class="pi ${SA.sel.has(p)?'on':''}" onclick="spoofAppToggle('${esc(p)}')">${appIcon(p)}<div class="n"><b>${esc(labelOf(p))}</b><span>${esc(p)}</span></div><span class="ck">${IC.check}</span></button>`).join(''):
   `<div class="empty">${(INST||[]).length?'Tidak ada aplikasi yang cocok.':'Tidak ada aplikasi pihak ketiga ditemukan.'}</div>`;
  spoofAppCount();}
function spoofAppToggle(p){SA.sel.has(p)?SA.sel.delete(p):SA.sel.add(p);
  document.querySelectorAll('#splist .pi').forEach(b=>{b.classList.toggle('on',SA.sel.has(b.querySelector('.n span').textContent));});spoofAppCount();}

async function spoofAppAdd(){
  const arr=[...SA.sel];if(!arr.length)return;
  let key=SA.key,man,mod;
  if(key==='custom'){man=($('#saMan').value||'').trim();mod=($('#saMod').value||'').trim();
    const ok=/^[A-Za-z0-9 ._+-]{1,40}$/;if(!ok.test(man)||!ok.test(mod)){toast('Isi manufacturer & model (huruf/angka/spasi . _ + -)');return;}}
  else{const p=SPOOF_PRESETS.find(x=>x[0]===key);if(!p)return;man=p[2];mod=p[3];}
  $('#spadd').disabled=true;let bad='';
  for(const p of arr){if(!/^[A-Za-z0-9._]+$/.test(p))continue;const r=await run(`spoofapp add ${p} ${key} '${man}' '${mod}' ${SA.full?1:0} ${chipArgs(CHIPS.find(c=>c[0]===PRESET_CHIP[key]))}`);if(!(r.out||'').trim().startsWith('OK'))bad=(r.out||'').split('|')[1]||'gagal';}

async function dpiApply(){

/* Countdown Pendinginan: dihitung per detik di client (bukan nunggu polling), lalu disinkronkan ulang
   ke backend tiap 10 detik supaya tidak ngedrift. Node #coolT di-update langsung tanpa render ulang
   seluruh kartu, biar detiknya jalan mulus. */
const fmtCool=r=>{const m=Math.floor(r/60),s=r%60;return m+':'+String(s).padStart(2,'0');};
let coolRem=0,coolTick=null,coolSync=null;
function coolWatch(){
  const active=(S&&S.cool>0);
  if(active){
    coolRem=S.cool;
    if(!coolTick)coolTick=setInterval(()=>{
      coolRem=Math.max(0,coolRem-1);
      const e=$('#coolT');if(e)e.textContent=fmtCool(coolRem);
      if(coolRem<=0){clearInterval(coolTick);coolTick=null;load();}
    },1000);
    if(!coolSync)coolSync=setInterval(loadQuiet,10000);
  }else{
    if(coolTick){clearInterval(coolTick);coolTick=null;}
    if(coolSync){clearInterval(coolSync);coolSync=null;}
  }
}

 <div style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><b style="display:block;font-size:14px">Ukur latensi (ping)</b><span style="font-size:12px;opacity:.65">ping 1.1.1.1 tiap 5 detik</span></div><label class="sw"><input type="checkbox" ${o.net?'checked':''} onchange="ovNet(this.checked)"><i></i></label></div></div>
 <div class="msec g">Rekam Layar (tombol REC di overlay)</div><div class="card">
  <div class="lbl">Resolusi</div>${seg('res',o.res,[['native','Asli'],['1080','1080p'],['720','720p']])}
  <div class="lbl" style="margin-top:12px">Bitrate</div>${seg('br',o.br,[['auto','Auto'],['8','8 Mbps'],['16','16 Mbps'],['24','24 Mbps']])}
  <div class="lbl" style="margin-top:12px">Frame rate</div>${seg('fps',o.fps,[['30','30'],['60','60'],['90','90'],['120','120']])}
  <div class="fnote" style="margin-top:12px">Pengaturan langsung dipakai tombol REC di overlay. Hasil: <b>Movies/Comatoze_*.mp4</b> (dipotong tiap 3 menit otomatis). Batas frame rate hanya berlaku bila ROM mendukung <code>--max-fps</code> pada screenrecord; selain itu mengikuti refresh rate layar.</div></div>
 <div class="card"><button class="btn tonal" onclick="ovTest()">Uji data overlay</button><div id="ovtest" style="font-size:12px;opacity:.8;margin-top:8px;word-break:break-word"></div></div>`;};
const SUBS={
 hz:{t:'Refresh Rate',f:hzSub},
 cpu:{t:'CPU & GPU',f:s=>pageCpu(s)+gedCard(s)},
 tmode:{t:'Tweak Ekstra',f:tmodeSub},
 thermal:{t:'Disable Thermal',f:thermalSub},
 chg:{t:'Daya & Charging',f:s=>pageChg(s)},
 mem:{t:'Memory & ZRAM',f:s=>memCard(s)+dramCard(s)},
 dns:{t:'Private DNS',f:s=>dnsCard(s)},
 exp:{t:'Eksperimental',f:s=>`<div class="card">${rows('exp')}</div>`},
 care:{t:'Perawatan',f:s=>dpiCard(s)+killCard()+cacheCard()+colorCard(s)},
 util:{t:'Utilitas',f:utilSub},
 ovl:{t:'Overlay & Manager',f:ovlSub},
 sys:{t:'Fitur Sistem',f:s=>`<div class="card">${rows('sys')}</div>`},
 dev:{t:'Perangkat',f:devCard},
 gglobal:{t:'Profil Game',f:s=>gpCard(s)+pgCard(s)},
 gauto:{t:'Otomatisasi Game',f:s=>`<div class="card">${rowsById(['gameprofile','gamethermal','gameclean','gamebypass','preload','gamednd'])}</div>`},
 ggfx:{t:'Grafis & Render',f:s=>gfxAppCard(s)+gfxCard(s)+angleStyleCard(s)},
 gspoof:{t:'Spoof Perangkat',f:s=>spoofAppCard(s)}
};
const TAB_T={home:'Comatoze',apps:'Aplikasi',tweaks:'Tweaks',set:'Pengaturan'};
const subTitle=id=>id.indexOf('app:')===0?labelOf(id.slice(4)):((SUBS[id]||{}).t||'');
function setBar(){const b=$('#bar'),h=$('#barT'),bk=$('#back'),sb=$('#sub');if(!b)return;b.classList.toggle('subp',!!sub);bk.hidden=!sub;h.textContent=sub?subTitle(sub):TAB_T[tab];sb.style.display=(sub||tab!=='home')?'none':'';}
function showPages(){document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',sub?e.id==='p-sub':e.id==='p-'+tab));}
function renderSub(){if(!S||!sub)return;const e=$('#p-sub');let h='';NOFOLD=true;
  try{h=sub.indexOf('app:')===0?appSub(sub.slice(4),S):(SUBS[sub]?SUBS[sub].f(S):'');}catch(err){h='<div class="card"><div class="note"><b class="dg">Gagal menampilkan halaman.</b> '+esc(String(err&&err.message||err))+'</div></div>';}
  finally{NOFOLD=false;}
  e.innerHTML=h;_sliderInit();_applyMark();}
function openSub(id){sub=id;try{history.pushState({sub:id},'');}catch(e){}renderSub();showPages();setBar();window.scrollTo({top:0});}
function closeSub(fromPop){if(!sub)return;sub=null;if(!fromPop){try{if(history.state&&history.state.sub)history.back();}catch(e){}}
  showPages();if(_dirty[tab])renderPage(tab);setBar();}
window.addEventListener('popstate',()=>{if(sub)closeSub(true);});

function navIndUpdate(){return;
  const nav=document.querySelector('nav'),btn=nav&&nav.querySelector('button.on'),ind=$('#navInd');
  if(!nav||!btn||!ind)return;
  const nr=nav.getBoundingClientRect(),br=btn.getBoundingClientRect();
  ind.style.width=Math.round(br.width)+'px';
  ind.style.transform='translateX('+Math.round(br.left-nr.left)+'px)';
}
function showTab(t){if(sub){sub=null;try{if(history.state&&history.state.sub)history.back();}catch(e){}}
  tab=t;if(_dirty[t])renderPage(t);showPages();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));setBar();window.scrollTo({top:0});}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{showTab(b.dataset.t);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');});
window.addEventListener('resize',navIndUpdate);
window.addEventListener('load',navIndUpdate);
navIndUpdate();

/* load(): bila status sedang berjalan, panggilan baru menunggu lalu menjalankan SATU status segar (hasil tidak basi, tidak menumpuk) */
let _ldP=null,_ldQ=null;
/* load() = muat paksa (setelah aksi pengguna). loadQuiet() = polling latar: dilewati bila layar tersembunyi dan tidak menggambar ulang bila status tidak berubah */
const UXK='ux_st_v2.35.3';let _force=false,_lastOut='';
function load(){_force=true;return _loadQ();}
function loadQuiet(){return document.hidden?Promise.resolve():_loadQ();}
function _loadQ(){
  if(!_ldP){_ldP=_load().finally(()=>{_ldP=null;});return _ldP;}
  if(!_ldQ){_ldQ=_ldP.then(()=>{_ldQ=null;return _loadQ();});}
  return _ldQ;
}
async function _load(){
  const f=_force;_force=false;
  const r=await run('status');
  if(!r.out&&S){$('#sub').textContent='Backend tidak terbaca (data lama)';return;}
  if(!r.out){$('#sub').textContent='Backend tidak terbaca';$('#p-home').innerHTML='<div class="card"><div class="note"><b class="dg">Backend tidak terbaca.</b><br>Buka lewat WebUI KernelSU / APatch / MMRL dan pastikan modul aktif.</div></div>';return;}
  if(!f&&r.out===_lastOut)return;_lastOut=r.out;
  try{localStorage.setItem(UXK,r.out);}catch(e){}
  S=parse(r.out);render();
}
/* antrean aksi: klik beruntun dijalankan satu per satu (tidak balapan di backend); toast muncul begitu perintah selesai, status disegarkan di latar */
let _aq=Promise.resolve();
const queueAct=f=>{const p=_aq.then(f,f);_aq=p.catch(()=>{});return p;};
async function setMode(m){animMode(m);toast('Menerapkan…');await queueAct(()=>run('mode '+m));toast('Mode '+(MODE_NAME[m]||m));load();}
async function setFeat(id,on){const r=await queueAct(()=>run(`feat ${id} ${on?'on':'off'}`));load();const o=((r&&r.out)||'').trim();if(/^ERR/.test(o)){toast(o.split('|')[1]||'Gagal');return;}toast((on?'Aktif: ':'Nonaktif: ')+(FEATURES.find(f=>f.id===id)||{}).name+(id==='nothermal'?' · reboot untuk efek penuh':''));}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function spinRefresh(){const b=$('#btnRefresh');if(!b)return;b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');}
function animMode(m){
  document.querySelectorAll('#p-home .mt,#p-home .mc,#p-home .mode').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const hh=$('#hero2'),cm=MODES.find(x=>x[0]===m);
  if(hh&&cm){hh.className='hero2 tn-'+cm[3];hh.querySelector('.core').innerHTML=IC[cm[1]]||'';$('#h2n').textContent=cm[2];$('#h2d').textContent=MODE_SHORT[m]+' · '+hzFor(S||{},m);}
  const t=$('#heroT'),z=$('#heroHz'),d=$('#heroD');if(!t||!z||!d)return;[t,z,d].forEach(e=>e.classList.add('out'));
  setTimeout(()=>{t.textContent=MODE_NAME[m]||m;z.textContent=hzFor(S||{},m);d.textContent=MODE_DESC[m]||'';[t,z,d].forEach(e=>e.classList.remove('out'));},130);}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.btn');if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');
  s.className='rip';s.style.width=s.style.height=d+'px';s.style.left=(e.clientX-r.left-d/2)+'px';s.style.top=(e.clientY-r.top-d/2)+'px';
  b.appendChild(s);setTimeout(()=>s.remove(),520);});
async function applyGpuP(){await run('gpu_fix '+SL.gpup_f.vals[+$('#gpup_f').value]);await load();toast('GPU diterapkan');}
async function applyOne(kind,name){
  const key=kind+'_'+(kind==='gpu'?'x':name),card=$('#pc_'+key),g=card.dataset.gov;
  const mn=SL[key+'_mn'].vals[+$('#'+key+'_mn').value],mx=SL[key+'_mx'].vals[+$('#'+key+'_mx').value];
  if(mn>mx){toast('Min tidak boleh > Max');return;}
  if(kind==='cpu'){if(g)await run(`cpu_gov ${name} ${g}`);await run(`cpu_freq ${name} ${mn} ${mx}`);}
  else{if(g)await run(`gpu_gov ${g}`);await run(`gpu_freq ${mn} ${mx}`);}
  await load();toast('Diterapkan');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePick();});
/* tampil instan dari status terakhir (kunci per versi modul), lalu disegarkan dari backend di latar */
try{const c=localStorage.getItem(UXK);if(c){S=parse(c);render();}}catch(e){}
load();
</script>
